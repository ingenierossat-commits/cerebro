<style>
:root {
  --bg: #0d0d0d;
  --ink: #f0ede6;
  --ink2: #757575;
  --ink3: #2e2c2a;
  --inkt: #757575;
  --paper: #161614;
  --paper2: #1e1e1b;
  --amber: #e8a030;
  --red: #e05555;
  --green: #4caf7d;
  --blue: #5b9bd5;
  --r: 12px;
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Instrument Serif', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.hdr {
  padding: 10px 18px;
  border-bottom: 1px solid var(--ink3);
  display: flex;
  align-items: center;
  gap: 14px;
}
.hdr-logo { height: 52px; width: auto; flex-shrink: 0; }
.hdr-sep  { width: 1px; height: 42px; background: #1a3a52; flex-shrink: 0; }
.hdr-text { display: flex; flex-direction: column; gap: 5px; }
.hdr-title {
  font-family: 'Georgia', serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 5px;
  line-height: 1;
  background: linear-gradient(90deg, #073160 0%, #1f4c76 30%, #147ca8 65%, #5ea7d5 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
}
.hdr-sub {
  font-size: 9px;
  color: #757575;
  text-transform: uppercase;
  letter-spacing: 0.52em;
  white-space: nowrap;
}

/* TOAST */
.toast {
  position: fixed;
  top: 20px; left: 50%; transform: translateX(-50%) translateY(-8px);
  background: var(--paper2);
  border: 1px solid var(--ink3);
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 13px;
  color: var(--ink);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 999;
  max-width: 90vw;
  white-space: normal;
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.toast.ok   { border-color: var(--green); color: var(--green); }
.toast.err  { border-color: var(--red);   color: var(--red);   }
.toast.info { border-color: var(--amber); color: var(--amber); }

/* CONTENIDO PRINCIPAL */
.main {
  flex: 1;
  padding: 20px 16px 30px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
}

/* SECCIÓN */
.section {
  background: var(--paper);
  border: 1px solid var(--ink3);
  border-radius: var(--r);
  overflow: hidden;
}

.section-header {
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--ink3);
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 2px;
  flex: 1;
  color: var(--inkt);
}
.label-guardar { color: var(--green); }
.label-recordar { color: var(--blue); }
.label-borrar   { color: var(--red); }

.section-body { padding: 10px 12px; }

/* TEXTAREA + CONTROLES */
.input-wrap {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.textarea {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--ink3);
  border-radius: 8px;
  padding: 9px 12px;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 15px;
  outline: none;
  resize: none;
  min-height: 44px;
  max-height: 100px;
  line-height: 1.4;
  transition: border-color 0.2s;
  overflow-y: auto;
  width: 100%;
}
.textarea:focus { border-color: var(--ink2); }
.textarea::placeholder { color: var(--inkt); font-style: italic; }

/* botones acción + micrófono */
.btn-group { display: flex; flex-direction: column; gap: 6px; }

.btn-action {
  border: none; border-radius: 8px;
  width: 40px; height: 40px;
  cursor: pointer; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s, transform 0.1s;
  flex-shrink: 0;
}
.btn-action:hover  { opacity: 0.85; }
.btn-action:active { transform: scale(0.95); }

.btn-send-g { background: var(--green); color: #0d0d0d; }
.btn-send-r { background: var(--blue);  color: #fff; }
.btn-send-b { background: var(--red);   color: #fff; }

.btn-mic {
  background: var(--ink3);
  color: var(--inkt);
  border: none; border-radius: 8px;
  width: 40px; height: 40px;
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.btn-mic:hover    { background: var(--paper2); color: var(--ink); }
.btn-mic.grabando { background: var(--red); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

.hint-sec {
  font-size: 10px;
  color: var(--inkt);
  margin-top: 7px;
  line-height: 1.6;
}

/* RESULTADOS BORRAR */
.resultados {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.res-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--bg);
  border: 1px solid var(--ink3);
  border-radius: 8px;
  padding: 9px 11px;
  transition: border-color 0.15s, background 0.15s;
}
.res-item.checked { background: rgba(224,85,85,0.07); border-color: var(--red); }
.res-check {
  width: 16px; height: 16px;
  accent-color: var(--red);
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 3px;
}
.res-text {
  flex: 1;
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink);
  word-break: break-word;
}
.res-fecha { font-size: 10px; color: var(--inkt); margin-top: 2px; }
mark { background: rgba(224,85,85,0.25); color: var(--ink); border-radius: 2px; padding: 0 1px; }

.btn-borrar-sel {
  margin-top: 8px;
  background: var(--red); color: #fff;
  border: none; border-radius: 8px;
  padding: 9px 16px;
  font-family: var(--mono); font-size: 12px;
  cursor: pointer; width: 100%;
  transition: opacity 0.15s;
}
.btn-borrar-sel:hover { opacity: 0.85; }
.btn-borrar-sel:disabled { opacity: 0.3; cursor: default; }

/* RESPUESTA RECORDAR */
.respuesta {
  margin-top: 10px;
  background: var(--bg);
  border: 1px solid var(--ink3);
  border-left: 3px solid var(--blue);
  border-radius: 8px;
  padding: 10px 13px;
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  display: none;
}
.respuesta.show { display: block; }

/* CONTADOR ABAJO */
.footer {
  text-align: center;
  padding: 10px;
  font-size: 10px;
  color: var(--inkt);
  border-top: 1px solid var(--ink3);
  flex-shrink: 0;
}

<script>
const STORE = 'segunda_memoria_v5';
let memos = [];
let micActivo = null;   // 'guardar' | 'recordar' | 'borrar'
let recognition = null;

// ── PERSISTENCIA ─────────────────────
function cargar() {
  try { memos = JSON.parse(localStorage.getItem(STORE)) || []; } catch { memos = []; }
}
function guardar() {
  localStorage.setItem(STORE, JSON.stringify(memos));
  actualizarFooter();
  // Enviar memos con fecha al service worker para programar notificaciones
  const memosFecha = memos.filter(m => m.esFecha);
  if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      tipo: 'guardar-memos',
      memos: memosFecha
    });
  }
}
function actualizarFooter() {
  const n = memos.length;
  document.getElementById('footer').textContent = n + ' nota' + (n !== 1 ? 's' : '') + ' guardadas · v2';
}

// ── TOAST ─────────────────────────────
let toastTimer;
function toast(txt, tipo = 'ok', ms = 3000) {
  const el = document.getElementById('toast');
  el.textContent = txt;
  el.className = 'toast show ' + tipo;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// ── AUTO-RESIZE TEXTAREA ──────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ── TECLAS ───────────────────────────
function keyGuardar(e)  { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); accionGuardar(); } }
function keyRecordar(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); accionRecordar(); } }
function keyBorrar(e)   { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); accionBorrar(); } }

// ── ① GUARDAR ────────────────────────
function accionGuardar() {
  const txt = document.getElementById('txtGuardar').value.trim();
  if (!txt) return;

  // ¿Es una entrada de fecha?
  if (/^fecha[.\s:]/i.test(txt)) {
    const contenido = txt.replace(/^fecha[.\s:]*/i, '').trim();
    const fechaISO  = parsearFecha(contenido);
    if (!fechaISO) {
      toast('⚠ No entendí la fecha. Ej: "Fecha. dentista el 15 de abril"', 'err');
      return;
    }
    const m = { id: uid(), texto: contenido, ts: Date.now(), esFecha: true, fechaEvento: fechaISO };
    memos.push(m);
    guardar();
    programarNotif(m);
    const dStr = new Date(fechaISO).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
    toast('✅ Guardado. Te avisaré el ' + dStr, 'ok', 4000);
  } else {
    memos.push({ id: uid(), texto: txt, ts: Date.now(), esFecha: false });
    guardar();
    toast('✅ Guardado', 'ok');
  }

  limpiar('guardar');
}

// ── ② RECORDAR ───────────────────────
function accionRecordar() {
  const txt = document.getElementById('txtRecordar').value.trim();
  if (!txt) return;

  // Si escribe "fecha" → mostrar todas las entradas de tipo fecha con su día de aviso
  const esBusquedaFecha = /^fecha[s]?$/i.test(txt.trim());
  let encontrados = [];

  if (esBusquedaFecha) {
    encontrados = memos.filter(m => m.esFecha);
  } else {
    const termino = txt
      .replace(/^[¿?]/, '')
      .replace(/[?]$/, '')
      .replace(/^(dónde|donde|está|están|es|hay|qué|que|quién|quien|tienes|recuerdas|muestrame|muéstrame|busca|cuándo|cuando)\s*/i, '')
      .trim();

    const palabras = (termino || txt).toLowerCase().split(/\s+/).filter(p => p.length > 2);
    if (termino) encontrados = buscar(termino);
    if (!encontrados.length) {
      for (const p of palabras) {
        encontrados = buscar(p);
        if (encontrados.length) break;
      }
    }
  }

  const resp = document.getElementById('respuesta');

  if (!encontrados.length) {
    resp.innerHTML = esBusquedaFecha
      ? 'No tienes ninguna fecha guardada.'
      : 'No encontré nada sobre eso.';
  } else if (esBusquedaFecha) {
    // Mostrar fechas con su día de aviso
    resp.innerHTML = `${encontrados.length} fecha${encontrados.length > 1 ? 's' : ''} activa${encontrados.length > 1 ? 's' : ''}:<br><br>` +
      encontrados
        .sort((a, b) => new Date(a.fechaEvento) - new Date(b.fechaEvento))
        .map((m, i) => `${i + 1}. 📅 ${esc(m.texto)} — <b>${fmtFecha(m.fechaEvento)}</b>`)
        .join('<br>');
  } else if (encontrados.length === 1) {
    resp.innerHTML = '📌 ' + esc(encontrados[0].texto);
  } else {
    resp.innerHTML = `Encontré ${encontrados.length} notas:<br><br>` +
      encontrados.map((m, i) => `${i + 1}. ${esc(m.texto)}`).join('<br>');
  }

  resp.classList.add('show');
  document.getElementById('btnOkRecordar').classList.add('activo');
  limpiar('recordar');
}

// ── ③ BORRAR ─────────────────────────
function accionBorrar() {
  const txt = document.getElementById('txtBorrar').value.trim();
  if (!txt) return;

  // Si escribe "fecha" mostrar todas las alertas activas
  const esBusquedaFecha = /^fecha$/i.test(txt.trim());
  const encontrados = esBusquedaFecha
    ? memos.filter(m => m.esFecha)
    : buscar(txt);
  const div = document.getElementById('resultados');
  const btnBorrar = document.getElementById('btnBorrarSel');

  if (!encontrados.length) {
    div.innerHTML = `<div style="color:var(--inkt);font-size:12px;padding:4px 0">No encontré entradas con "${esc(txt)}".</div>`;
    btnBorrar.style.display = 'none';
    limpiar('borrar');
    return;
  }

  div.innerHTML = encontrados.map(m => `
    <div class="res-item" id="ri_${m.id}">
      <input type="checkbox" class="res-check" id="chk_${m.id}"
        onchange="onCheck('${m.id}', this)">
      <div style="flex:1">
        <div class="res-text">${resaltar(esc(m.texto), txt)}</div>
        <div class="res-fecha">${fmtTs(m.ts)}${m.esFecha ? ' · 📅 ' + fmtFecha(m.fechaEvento) : ''}</div>
      </div>
    </div>
  `).join('');

  btnBorrar.style.display = 'block';
  btnBorrar.disabled = true;
  limpiar('borrar');
}

function onCheck(id, el) {
  document.getElementById('ri_' + id)?.classList.toggle('checked', el.checked);
  const alguna = document.querySelectorAll('.res-check:checked').length > 0;
  document.getElementById('btnBorrarSel').disabled = !alguna;
}

function borrarSeleccionadas() {
  const checks = document.querySelectorAll('.res-check:checked');
  if (!checks.length) return;
  const ids = Array.from(checks).map(c => c.id.replace('chk_', ''));
  memos = memos.filter(m => !ids.includes(m.id));
  guardar();
  document.getElementById('resultados').innerHTML = '';
  document.getElementById('btnBorrarSel').style.display = 'none';
  toast(`🗑 ${ids.length} entrada${ids.length > 1 ? 's borradas' : ' borrada'}`, 'info');
}

// ── BÚSQUEDA LOCAL ────────────────────
// Reduce una palabra a su raíz eliminando terminaciones comunes en español
function raiz(palabra) {
  let p = palabra.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const sufijos = ['aciones','amiento','imientos','imiento','idades','ando','iendo',
    'adas','ados','idos','idas','uras','ura','eros','eras','ero','era',
    'istas','ista','mente','cion','nes','les','res','es','os','as','ar','er','ir','al'];
  for (const s of sufijos) {
    if (p.endsWith(s) && p.length - s.length >= 3) { p = p.slice(0, -s.length); break; }
  }
  return p;
}

function buscar(termino) {
  const palabras = termino.toLowerCase().split(/\s+/).filter(Boolean);
  return memos.filter(m => {
    const textoNorm = m.texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return palabras.every(p => {
      if (textoNorm.includes(p)) return true;          // coincidencia exacta
      const pRaiz = raiz(p);
      return textoNorm.split(/\s+/).some(w => {        // coincidencia por raíz
        const wRaiz = raiz(w);
        return wRaiz.startsWith(pRaiz) || pRaiz.startsWith(wRaiz);
      });
    });
  });
}

function resaltar(html, termino) {
  const palabras = termino.split(/\s+/).filter(Boolean);
  return palabras.reduce((h, p) =>
    h.replace(new RegExp(escRx(p), 'gi'), s => `<mark>${s}</mark>`), html);
}

// ── PARSEAR FECHA EN ESPAÑOL ──────────
const MESES = {
  enero:1, febrero:2, marzo:3, abril:4, mayo:5, junio:6,
  julio:7, agosto:8, septiembre:9, octubre:10, noviembre:11, diciembre:12
};
function parsearFecha(txt) {
  const m = txt.match(/\b(\d{1,2})\s+de\s+([a-záéíóúñ]+)(?:\s+(?:de\s+)?(\d{4}))?/i);
  if (!m) return null;
  const dia = parseInt(m[1]);
  const mes = MESES[m[2].toLowerCase()];
  if (!mes) return null;
  const hoy = new Date();
  let anyo = m[3] ? parseInt(m[3]) : hoy.getFullYear();
  const d = new Date(anyo, mes - 1, dia);
  if (!m[3] && d < hoy) d.setFullYear(anyo + 1);
  // Usar formato local para evitar desfase UTC
  const yy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yy}-${mm}-${dd}`;
}

// ── NOTIFICACIONES ────────────────────
function programarNotif(m) {
  // Ya no usamos setTimeout aquí — lo gestiona el service worker
}

function enviarMemosAlSW() {
  const memosFecha = memos.filter(m => m.esFecha);
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(reg => {
    if (reg.active) {
      reg.active.postMessage({ tipo: 'guardar-memos', memos: memosFecha });
    }
  });
}

function reprogramarTodas() {
  const ayer = Date.now() - 86400000;
  memos = memos.filter(m => !m.esFecha || new Date(m.fechaEvento).getTime() > ayer);
  guardar();
  enviarMemosAlSW();
}

// ── VOZ ───────────────────────────────
function toggleMic(cual) {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    toast('Tu navegador no soporta reconocimiento de voz', 'err');
    return;
  }

  // Si ya está grabando el mismo, parar
  if (micActivo === cual && recognition) {
    recognition.stop();
    return;
  }

  // Si hay otro activo, pararlo primero
  if (recognition) recognition.stop();

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'es-ES';
  recognition.continuous = false;
  recognition.interimResults = true;

  micActivo = cual;
  const btnId = 'mic' + cual.charAt(0).toUpperCase() + cual.slice(1);
  const txtId = 'txt'  + cual.charAt(0).toUpperCase() + cual.slice(1);
  document.getElementById(btnId).classList.add('grabando');

  recognition.onresult = e => {
    let texto = '';
    for (let i = 0; i < e.results.length; i++) texto += e.results[i][0].transcript;
    document.getElementById(txtId).value = texto;
    autoResize(document.getElementById(txtId));
  };

  recognition.onend = () => {
    document.getElementById(btnId).classList.remove('grabando');
    micActivo = null;
    recognition = null;
  };

  recognition.onerror = () => {
    document.getElementById(btnId).classList.remove('grabando');
    micActivo = null;
    recognition = null;
    toast('Error en el micrófono', 'err');
  };

  recognition.start();
}

// ── HELPERS ──────────────────────────
function cerrarRespuesta() {
  const resp = document.getElementById('respuesta');
  resp.innerHTML = '';
  resp.classList.remove('show');
  document.getElementById('btnOkRecordar').classList.remove('activo');
}

function limpiar(cual) {
  const id = 'txt' + cual.charAt(0).toUpperCase() + cual.slice(1);
  const el = document.getElementById(id);
  el.value = '';
  el.style.height = 'auto';
}

function fmtTs(ts) {
  return new Date(ts).toLocaleString('es-ES', {
    day: 'numeric', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}
function fmtFecha(iso) {
  return new Date(iso).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}
function esc(s)   { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escRx(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function uid()    { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ── ARRANQUE ─────────────────────────
cargar();
reprogramarTodas();
actualizarFooter();

if ('Notification' in window && Notification.permission === 'default') {
  setTimeout(() => Notification.requestPermission(), 1000);
}
